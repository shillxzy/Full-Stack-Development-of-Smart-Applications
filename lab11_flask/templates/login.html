{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h1 class="mb-3">Вхід</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="username">Логін</label>
      <input class="form-control" id="username" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="password">Пароль</label>
      <input class="form-control" id="password" type="password" name="password" required></div>
    <button class="btn btn-primary w-100">Увійти</button>
  </form>
</div>
{% endblock %}
