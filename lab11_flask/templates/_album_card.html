<div class="card h-100 shadow-sm">
  {% if album.cover_url %}
    <img src="{{ album.cover_url }}" class="card-img-top album-cover" alt="Обкладинка {{ album.title }}">
  {% else %}
    <div class="album-cover placeholder-cover d-flex align-items-center justify-content-center">{{ album.title[:1] }}</div>
  {% endif %}
  <div class="card-body">
    <h3 class="h5 card-title">{{ album.title }}</h3>
    <p class="card-text text-muted mb-2">{{ album.year }} · {{ album.track_list|length }} треків</p>
    <a href="{{ url_for('album_detail', album_id=album.id) }}" class="stretched-link">Детальніше</a>
  </div>
</div>
